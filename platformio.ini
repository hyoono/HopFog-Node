; HopFog Node – PlatformIO Configuration
;
; Build for ESP32-CAM (default):  pio run -e esp32cam
; Build for Wemos D1 Mini:        pio run -e d1_mini
; Upload:                         pio run -e <env> -t upload
; Serial monitor:                 pio device monitor

[platformio]
default_envs = esp32cam

; ── shared settings ──────────────────────────────────────────────
[env]
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
monitor_speed = 115200

; ── ESP32-CAM (AI-Thinker) ──────────────────────────────────────
[env:esp32cam]
platform = espressif32
board = esp32cam
build_flags =
    -D BOARD_ESP32CAM

; ── Wemos D1 Mini (ESP8266) ─────────────────────────────────────
[env:d1_mini]
platform = espressif8266
board = d1_mini
build_flags =
    -D BOARD_D1_MINI
